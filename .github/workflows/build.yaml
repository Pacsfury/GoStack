name: Auto Build GoStack Nightly

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Build Binary
        id: build
        run: |
          BUILD_NUM=$(git rev-list --count HEAD)
          echo "build_num=$BUILD_NUM" >> $GITHUB_OUTPUT
          go build -o gostack-build-$BUILD_NUM .

      - name: Create Nightly Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nightly-${{ steps.build.outputs.build_num }}
          name: "Nightly Build #${{ steps.build.outputs.build_num }}"
          prerelease: true
          files: gostack-build-${{ steps.build.outputs.build_num }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
