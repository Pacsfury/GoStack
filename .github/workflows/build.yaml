name: Auto Build GoStack Nightly

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Get Build Number
        id: buildnum
        run: |
          BUILD_NUM=$(git rev-list --count HEAD)
          echo "build_num=$BUILD_NUM" >> $GITHUB_OUTPUT

      - name: Build for Linux
        run: |
          BUILD_NUM=${{ steps.buildnum.outputs.build_num }}
          GOOS=linux GOARCH=amd64 go build -o gostack-linux-$BUILD_NUM .

      - name: Build for Windows
        run: |
          BUILD_NUM=${{ steps.buildnum.outputs.build_num }}
          GOOS=windows GOARCH=amd64 go build -o gostack-windows-$BUILD_NUM.exe .

      - name: Build for macOS
        run: |
          BUILD_NUM=${{ steps.buildnum.outputs.build_num }}
          GOOS=darwin GOARCH=amd64 go build -o gostack-macos-$BUILD_NUM .

      - name: Create Nightly Release and Upload All
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nightly-${{ steps.buildnum.outputs.build_num }}
          name: "Nightly Build #${{ steps.buildnum.outputs.build_num }}"
          prerelease: true
          files: |
            gostack-linux-${{ steps.buildnum.outputs.build_num }}
            gostack-windows-${{ steps.buildnum.outputs.build_num }}.exe
            gostack-macos-${{ steps.buildnum.outputs.build_num }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
